bundle:
  name: dbx-bundle-poc

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

variables:
  catalog:
    description: "Catalog to use"
    default: hive_metastore
  schema:
    description: "Schema to use"
    default: default

targets:
  dev:
    variables:
      catalog: krg_assessment_databricks_workspace
  qa:
    variables:
      catalog: kroger_poc_qa
  prod:
    variables:
      catalog: kroger_poc_prod

resources:
  jobs:
    etl_demo_job:
      name: dbx-bundle-poc-${bundle.target}-etl
      tasks:
        - task_key: create_demo_table
          notebook_task:
            notebook_path: ./notebooks/00_create_demo_table.ipynb
        - task_key: etl_demo
          notebook_task:
            notebook_path: ./notebooks/10_etl_demo.ipynb
          depends_on:
            - task_key: create_demo_table
        - task_key: transform_sales
          notebook_task:
            notebook_path: ./notebooks/20_transform_sales.ipynb
          depends_on:
            - task_key: etl_demo

  pipelines:
    sales_pipeline:
      name: dbx-bundle-poc-${bundle.target}-pipeline
      target: ${bundle.target}
      continuous: false
      libraries:
        - notebook:
            path: ./notebooks/dlt_sales_pipeline.ipynb
