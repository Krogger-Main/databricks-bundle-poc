bundle:
  name: dbx-bundle-poc

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

variables:
  catalog:
    description: "Catalog to use"
    default: hive_metastore   # safe fallback
  schema:
    description: "Schema to use"
    default: default

targets:
  dev:
    variables:
      catalog: kroger_poc      # dev workspace has this catalog
  qa:
    variables:
      catalog: kroger_poc_qa   # QA has its own catalog
  prod:
    variables:
      catalog: kroger_poc_prod # Prod has its own catalog

resources:
  jobs:
    etl_demo_job:
      name: dbx-bundle-poc-${bundle.target}-etl
      tasks:
        - task_key: create_demo_table
          description: "Create demo table"
          notebook_task:
            notebook_path: ./notebooks/00_create_demo_table.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: etl_demo
          description: "ETL Demo Pipeline"
          notebook_task:
            notebook_path: ./notebooks/10_etl_demo.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          depends_on:
            - task_key: create_demo_table

        - task_key: transform_sales
          description: "Transform sales data"
          notebook_task:
            notebook_path: ./notebooks/20_transform_sales.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          depends_on:
            - task_key: etl_demo
